name: Build and archive production mini program

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: diaoxia-miniapp-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Build WeChat mini program
        run: |
          npm ci
          npm run build:mp-weixin
          tar -C unpackage/dist/build/mp-weixin -czf diaoxia-miniapp.tgz .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and archive mini program
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o BatchMode=yes diaoxia-miniapp.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/releases/diaoxia-miniapp.tgz.upload"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv /home/deploy/releases/diaoxia-miniapp.tgz.upload /home/deploy/releases/diaoxia-miniapp.tgz && sudo /usr/local/sbin/deploy-diaoxia-miniapp"
