name: Build WeChat mini program

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: diaoxia-miniapp-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_APP_API_BASE_URL: https://diaox.daioxia.cn

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build:mp-weixin

      - name: Save build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wechat-mini-program-production-upload-${{ github.sha }}
          path: unpackage/dist/build/mp-weixin
          if-no-files-found: error
          retention-days: 14
