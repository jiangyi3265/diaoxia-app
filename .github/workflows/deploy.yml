name: Build and upload WeChat mini program

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: diaoxia-miniapp-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  WECHAT_APPID: wx56d182594c05ce23
  VITE_APP_API_BASE_URL: https://diaox.daioxia.cn

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build:mp-weixin

      - name: Verify production API domain
        run: |
          grep -R -F "https://diaox.daioxia.cn" unpackage/dist/build/mp-weixin >/dev/null

      - name: Save build artifact
        uses: actions/upload-artifact@v7
        with:
          name: diaoxia-mp-weixin-${{ github.sha }}
          path: unpackage/dist/build/mp-weixin
          if-no-files-found: error
          retention-days: 14

      - name: Prepare WeChat upload key
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          if [ -z "$WECHAT_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret WECHAT_PRIVATE_KEY"
            exit 1
          fi
          umask 077
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$RUNNER_TEMP/private.$WECHAT_APPID.key"

      - name: Upload to WeChat
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/private.wx56d182594c05ce23.key
          WECHAT_VERSION: 1.0.${{ github.run_number }}
        run: |
          npx --yes miniprogram-ci@2.1.31 upload \
            --pp unpackage/dist/build/mp-weixin \
            --pkp "$WECHAT_PRIVATE_KEY_PATH" \
            --appid "$WECHAT_APPID" \
            --uv "$WECHAT_VERSION" \
            -r 1 \
            --use-project-config true
